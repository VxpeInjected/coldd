<!doctype html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add('js');</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Signing in — coldd</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<!-- This screen had its own hardcoded palette - #0a0a0a ground, a MONOSPACE
     face, a #b23a3a spinner - so the moment right after signing in looked like
     a terminal rather than coldd. It costs nothing to load the real stylesheet
     here: the visitor arrived from /signin, so it is already cached. -->
<link rel="stylesheet" href="/styles.css?v=20260809e" />
<style>
  .cb-wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .cb-card { display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 40px 44px; border-radius: var(--r); min-width: 280px; text-align: center; }
  .cb-logo { height: 30px; width: auto; display: block; opacity: 0.92; }
  /* Ember, matching every other loading state on the site. */
  .cb-spin { width: 26px; height: 26px; border: 2px solid var(--hairline);
    border-top-color: var(--accent); border-radius: 50%; animation: cbspin .8s linear infinite; }
  @keyframes cbspin { to { transform: rotate(360deg); } }
  .cb-card p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--fg-2); max-width: 34ch; }
  /* The spinner is the only motion here and it signals work in progress, so
     under reduced motion it holds still rather than vanishing - a static ring
     still reads as "waiting". */
  @media (prefers-reduced-motion: reduce) { .cb-spin { animation: none; } }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="scrim"></div>
  <div class="cb-wrap">
    <div class="cb-card glass">
      <img class="cb-logo" src="/logo.png" alt="coldd" />
      <div class="cb-spin" aria-hidden="true"></div>
      <p id="cbMsg" role="status">Finishing sign-in…</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/supabase-init.js?v=20260809b"></script>
  <script src="/site-gate.js?v=20260729b"></script>
  <script>
    (async function () {
      var msg = document.getElementById('cbMsg');
      function fail(text) {
        msg.textContent = text;
        setTimeout(function () { location.href = '/signin'; }, 1800);
      }
      // If this Discord sign-in was triggered as a re-auth (Security tab
      // or Linked Accounts asking the user to re-verify via their
      // original sign-up method), send them back to the panel that asked
      // instead of the normal post-login redirect.
      function postLoginRedirect() {
        var target = null;
        try { target = sessionStorage.getItem('coldd_reauth_target'); sessionStorage.removeItem('coldd_reauth_target'); } catch (e) {}
        return target ? ('/dashboard?panel=' + target + '&verified=1') : '/dashboard';
      }
      try {
        if (!window.coldSupabase) throw new Error('Supabase client unavailable.');

        var session = null;
        for (var i = 0; i < 5 && !session; i++) {
          var res = await window.coldSupabase.auth.getSession();
          session = res && res.data ? res.data.session : null;
          if (!session) await new Promise(function (r) { setTimeout(r, 300); });
        }
        if (!session) throw new Error('No session returned from Discord.');

        var user = session.user;
        var provider = (user.app_metadata && user.app_metadata.provider) || 'email';
        var identity = (user.identities && user.identities[0] && user.identities[0].identity_data) || {};
        var meta = user.user_metadata || {};
        var email = user.email || identity.email || '';

        if (provider !== 'discord') {
          // Email/password account confirming for the first time (or any
          // other non-Discord provider) - simple profile, no guild lookups.
          var basicName = meta.full_name || meta.name || (email ? email.split('@')[0] : 'Member');
          // Only set username if the profile doesn't already have one - a
          // user who customized their display name via Account Settings
          // must not have it silently reverted on every future sign-in.
          var existingBasic = await window.coldSupabase.from('profiles').select('username').eq('id', user.id).maybeSingle();
          var basicPayload = { id: user.id, email: email, updated_at: new Date().toISOString() };
          var finalBasicName = (existingBasic.data && existingBasic.data.username) || basicName;
          if (!existingBasic.data || !existingBasic.data.username) basicPayload.username = basicName;
          var upsertBasic = await window.coldSupabase.from('profiles').upsert(basicPayload);
          if (upsertBasic.error) console.warn('[coldd] profile upsert failed:', upsertBasic.error.message);

          window.coldAuth.saveProfile({ id: user.id, provider: provider, name: finalBasicName, email: email, avatar: '' });
          try { localStorage.setItem('coldd_auth', 'in'); } catch (e) {}
          window.coldAuth.attributeReferral();

          msg.textContent = 'Signed in as ' + finalBasicName + '. Redirecting…';
          setTimeout(function () { location.href = postLoginRedirect(); }, 500);
          return;
        }

        var discordId = identity.provider_id || identity.sub || meta.provider_id || '';
        var name = (identity.custom_claims && identity.custom_claims.global_name) ||
                    identity.full_name || identity.name || meta.full_name || meta.name || 'Discord User';
        var avatar = identity.avatar_url || meta.avatar_url || '';

        // provider_token is Discord's own access token, only present on the
        // session object returned right after OAuth completes.
        var providerToken = session.provider_token || '';
        var guilds = [];
        var memberInfo = null;

        if (providerToken) {
          try {
            var guildsRes = await fetch('https://discord.com/api/users/@me/guilds', {
              headers: { Authorization: 'Bearer ' + providerToken }
            });
            if (guildsRes.ok) guilds = await guildsRes.json();
            else console.warn('[coldd] guild list fetch failed:', guildsRes.status);
          } catch (e) { console.warn('[coldd] guild list fetch error:', e); }

          var targetGuild = window.coldAuth.targetGuildId;
          if (targetGuild) {
            try {
              var memberRes = await fetch('https://discord.com/api/users/@me/guilds/' + targetGuild + '/member', {
                headers: { Authorization: 'Bearer ' + providerToken }
              });
              if (memberRes.ok) memberInfo = await memberRes.json();
              else console.warn('[coldd] guild member fetch failed:', memberRes.status);
            } catch (e) { console.warn('[coldd] guild member fetch error:', e); }
          }
        }

        // Only set username if the profile doesn't already have one - a
        // user who customized their display name via Account Settings
        // must not have it silently reverted to their Discord name on
        // every future sign-in.
        var existingDiscord = await window.coldSupabase.from('profiles').select('username').eq('id', user.id).maybeSingle();
        var finalName = (existingDiscord.data && existingDiscord.data.username) || name;
        var discordPayload = {
          id: user.id,
          discord_id: discordId,
          email: email,
          avatar_url: avatar,
          guilds: guilds,
          member_info: memberInfo,
          updated_at: new Date().toISOString()
        };
        if (!existingDiscord.data || !existingDiscord.data.username) discordPayload.username = name;
        var upsertRes = await window.coldSupabase.from('profiles').upsert(discordPayload);
        if (upsertRes.error) console.warn('[coldd] profile upsert failed:', upsertRes.error.message);

        window.coldAuth.saveProfile({ id: user.id, provider: 'discord', discordId: discordId, name: finalName, email: email, avatar: avatar, guilds: guilds, memberInfo: memberInfo });
        try { localStorage.setItem('coldd_auth', 'in'); } catch (e) {}
        window.coldAuth.attributeReferral();

        msg.textContent = 'Signed in as ' + finalName + '. Redirecting…';
        setTimeout(function () { location.href = postLoginRedirect(); }, 500);
      } catch (err) {
        console.error('[coldd] callback error:', err);
        fail('Sign-in failed. Redirecting…');
      }
    })();
  </script>
</body>
</html>
