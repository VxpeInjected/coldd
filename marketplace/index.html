<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting to the shop…</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://coldd.dev/shop" />
  <!-- /assets, /market and /marketplace are kept only as redirects to
       /shop, the canonical catalog URL. The query string and hash are
       carried across so e.g. /assets?cat=maps still lands on the right
       filtered view. -->
  <script>location.replace('/shop/' + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=/shop/" />
</head>
<body>
  <p>The shop has moved to <a href="/shop/">coldd.dev/shop</a>.</p>
</body>
</html>
