<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>coldd Development Reset password</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <div class="backdrop"></div>
  <div class="glow"></div>
  <div class="scrim"></div>
  <div class="grain"></div>
  <a class="auth-home" href="index.html" aria-label="coldd home"><img class="logo" src="logo.png" alt="coldd" /></a>
  <main class="auth-wrap">
    <div class="glass auth-card">
      <h1>Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send a link to reset it.</p>
      <form class="auth-form" id="form-forgot" novalidate>
        <div class="auth-field" data-for="email">
          <label for="fo-email">Email</label>
          <input id="fo-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
          <span class="auth-err"></span>
        </div>
        <button class="btn btn-primary auth-submit" type="submit">Send reset link</button>
        <div class="auth-msg"></div>
      </form>
      <p class="auth-alt"><a href="signin.html">← Back to sign in</a></p>
    </div>
  </main>
  <script src="auth.js"></script>
</body>
</html>
