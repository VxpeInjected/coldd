<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Signing in with Roblox — coldd</title>
<style>
  html,body{height:100%;margin:0;background:#0a0a0a;color:#d7d7d7;font-family:'IBM Plex Mono',ui-monospace,monospace;}
  .cb-wrap{height:100%;display:flex;align-items:center;justify-content:center;}
  .cb-card{border:1px solid #262626;background:#111;padding:32px 36px;text-align:center;min-width:280px;}
  .cb-spin{width:22px;height:22px;margin:0 auto 16px;border:2px solid #262626;border-top-color:#b23a3a;border-radius:50%;animation:cbspin .8s linear infinite;}
  @keyframes cbspin{to{transform:rotate(360deg);}}
  .cb-card p{margin:0;font-size:13px;letter-spacing:.02em;color:#a3a3a3;}
</style>
</head>
<body>
  <div class="cb-wrap">
    <div class="cb-card">
      <div class="cb-spin" aria-hidden="true"></div>
      <p id="cbMsg">Finishing with Roblox…</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/supabase-init.js?v=20260729b"></script>
  <script src="/site-gate.js?v=20260729b"></script>
  <script>
    (async function () {
      var msg = document.getElementById('cbMsg');
      function fail(text) {
        msg.textContent = text;
        setTimeout(function () { location.href = '/signin'; }, 2200);
      }
      try {
        if (!window.coldSupabase) throw new Error('Supabase client unavailable.');

        var params = new URLSearchParams(location.search);
        var error = params.get('error');
        if (error) throw new Error('Roblox denied the request: ' + error);

        var code = params.get('code');
        var state = params.get('state');
        if (!code) throw new Error('No authorization code returned.');

        var expectedState = null;
        try { expectedState = sessionStorage.getItem('coldd_roblox_oauth_state'); } catch (e) {}
        try { sessionStorage.removeItem('coldd_roblox_oauth_state'); } catch (e) {}
        if (!expectedState || state !== expectedState) throw new Error('State mismatch - possible CSRF, aborting.');

        var redirectUri = location.origin + '/roblox-callback.html';

        // If we're already signed into coldd, this is linking an existing
        // account (started from the dashboard). Otherwise it's a primary
        // sign-in/sign-up (started from /signin or /signup).
        var sessionRes = await window.coldSupabase.auth.getSession();
        var session = sessionRes && sessionRes.data ? sessionRes.data.session : null;

        if (session) {
          var linkData = await window.coldAuth.invokeFn('roblox-oauth-callback', { code: code, redirectUri: redirectUri });
          // If this was triggered as a re-auth (Security tab / Linked
          // Accounts asking to re-verify via Roblox, the account's
          // original sign-up method), send them back there instead of
          // the normal link-flow destination.
          var reauthTarget = null;
          try { reauthTarget = sessionStorage.getItem('coldd_reauth_target'); sessionStorage.removeItem('coldd_reauth_target'); } catch (e) {}
          msg.textContent = 'Linked as ' + linkData.robloxUsername + '. Redirecting…';
          setTimeout(function () {
            location.href = reauthTarget ? ('/dashboard?panel=' + reauthTarget + '&verified=1') : '/dashboard?panel=account';
          }, 700);
          return;
        }

        var signinData = await window.coldAuth.invokeFn('roblox-signin', { code: code, redirectUri: redirectUri });

        var verifyRes = await window.coldSupabase.auth.verifyOtp({
          email: signinData.email, token: signinData.otp, type: 'email'
        });
        if (verifyRes.error || !verifyRes.data || !verifyRes.data.session) {
          throw new Error((verifyRes.error && verifyRes.error.message) || 'Could not establish a session.');
        }

        window.coldAuth.saveProfile({
          id: verifyRes.data.user.id, provider: 'roblox', name: signinData.robloxUsername,
          email: '', avatar: signinData.avatarUrl || ''
        });
        try { localStorage.setItem('coldd_auth', 'in'); } catch (e) {}
        window.coldAuth.attributeReferral();

        msg.textContent = 'Signed in as ' + signinData.robloxUsername + '. Redirecting…';
        setTimeout(function () { location.href = '/dashboard'; }, 700);
      } catch (err) {
        console.error('[coldd] roblox callback error:', err);
        fail((err && err.message) || 'Could not continue with Roblox. Redirecting…');
      }
    })();
  </script>
</body>
</html>
