<!doctype html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add('js');</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Connecting TikTok - coldd</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<!-- Admin-only utility page, not part of the storefront - reuses the
     same .cb-* callback card as /callback.html and /roblox-callback.html
     so it doesn't need its own stylesheet. TikTok's Login Kit isn't a
     Supabase Auth provider, so unlike those two this hand-rolls the
     authorization-code exchange via tiktok-oauth-exchange rather than
     going through coldSupabase.auth. -->
<link rel="icon" type="image/png" href="/logo.png" />
<meta name="theme-color" content="#15161b" />
<link rel="stylesheet" href="/styles.css?v=20260814d" />
<style>
  .cb-token-box { width: 100%; margin-top: 14px; padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--hairline); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    color: var(--fg-1); word-break: break-all; text-align: left; max-height: 120px; overflow-y: auto; }
  .cb-token-label { font-size: 11px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 14px; }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="scrim"></div>
  <div class="cb-wrap">
    <div class="cb-card glass" id="cbCard" data-state="working" style="max-width:460px;">
      <img class="cb-logo" src="/logo.png" alt="coldd" />
      <div class="cb-spin" aria-hidden="true"></div>
      <div class="cb-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2h.01"/>
        </svg>
      </div>
      <div class="cb-icon-ok" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </div>
      <p id="cbMsg" role="status">Connecting to TikTok…</p>
      <div id="cbResult" hidden></div>
      <a class="cb-out lnk-back" href="/admin">Back to admin</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/supabase-init.js?v=20260814a"></script>
  <script src="/site-gate.js?v=20260729b"></script>
  <script>
    (async function () {
      var msg = document.getElementById('cbMsg');
      var card = document.getElementById('cbCard');
      function fail(text) {
        card.setAttribute('data-state', 'error');
        msg.textContent = text;
      }
      try {
        if (!window.coldSupabase || !window.coldAuth) throw new Error('Could not reach coldd. Please try again.');

        var params = new URLSearchParams(location.search);
        var error = params.get('error');
        if (error) throw new Error('TikTok denied the request: ' + (params.get('error_description') || error));
        var code = params.get('code');
        if (!code) throw new Error('No authorization code in the URL.');

        var who = await window.coldAuth.checkIsAdmin();
        if (!who.isAdmin) throw new Error('Admin access required to connect TikTok.');

        var redirectUri = location.origin + location.pathname;
        var res = await window.coldSupabase.functions.invoke('tiktok-oauth-exchange', { body: { code: code, redirectUri: redirectUri } });
        var data = res && res.data;
        if (res.error || !data || !data.ok) {
          var serverMsg = null;
          if (res.error && res.error.context && typeof res.error.context.json === 'function') {
            var parsed = await res.error.context.json().catch(function () { return null; });
            serverMsg = parsed && parsed.error;
          }
          throw new Error(serverMsg || (data && data.error) || 'TikTok token exchange failed.');
        }

        card.setAttribute('data-state', 'ok');
        msg.textContent = 'Connected. Copy the access token below and paste it back to Claude to finish setup.';
        var resultEl = document.getElementById('cbResult');
        resultEl.hidden = false;
        var expiresH = data.expiresIn ? Math.round(data.expiresIn / 3600) : null;
        resultEl.innerHTML =
          '<div class="cb-token-label">Access token (expires in ' + (expiresH != null ? expiresH + 'h' : 'a while') + ')</div>' +
          '<div class="cb-token-box">' + data.accessToken.replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</div>' +
          (data.refreshToken ? '<div class="cb-token-label">Refresh token (save this too - needed once the access token expires)</div><div class="cb-token-box">' + data.refreshToken.replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</div>' : '');
      } catch (err) {
        console.error('[coldd] tiktok callback error:', err);
        fail(err.message || 'Could not connect TikTok.');
      }
    })();
  </script>
</body>
</html>
